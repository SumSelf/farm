# 闪马田园 SUMFARM · 安全加固 Nginx 配置（站点 iarm.fun）
# 用法：把本文件 include 进 http{}（limit_req_zone）与 server{}（其余段），
#       或按注释拆分。未加载本配置 = 不符合上线条件，见 SECURITY.md「上线阻断清单」。
# 说明：静态站没有服务端，一切访问控制都必须在这一层生效；robots.txt / noindex 不是防护。

# ---------- http{} 级：限流 ----------
# 登录 / 注册 / 找回口令 / 后台登录：按 IP 限速，缓解撞库与爆破
limit_req_zone $binary_remote_addr zone=sf_auth:10m rate=5r/m;
# 普通 API：按 IP 限速
limit_req_zone $binary_remote_addr zone=sf_api:10m rate=30r/s;
# 上传：单独限流
limit_req_zone $binary_remote_addr zone=sf_upload:10m rate=2r/m;
limit_req_status 429;

server_tokens off;
autoindex off;

server {
    listen 443 ssl http2;
    server_name iarm.fun;

    # ---------- TLS ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # ssl_certificate / ssl_certificate_key 由运维按实际证书配置

    # ---------- 安全响应头（全站，含后台）----------
    # 站点 0 内联 script/style/on* 属性，可用严格 CSP；frame-ancestors 只能由响应头下发
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://iarm.fun; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cache-Control "no-store" always;   # 后台 / 登录态页面由下方 location 覆盖

    root /var/www/sumfarm-v1.7.0;   # 指向解压后的站点根（不是 _internal 的父目录之外）
    index index.html;
    error_page 404 /404.html;

    # ---------- P0：内部资料目录，物理隔离 + 网络层拒绝 ----------
    # db/schema.sql、api_catalog.json、Python 源码、走查报告、渲染后 DOM 取样都在这里，
    # 任何一个被公网下载都是完整后端设计图泄露。
    location ^~ /_internal/ { deny all; return 404; }

    # ---------- P0：开发者工具页不得对公网开放 ----------
    # 这两页会把 74 条接口、参数范围、关联表、流程备注整张 API 地图显示出来。
    location = /api-catalog.html { deny all; return 404; }
    location = /api-lab.html     { deny all; return 404; }

    # ---------- P0：后台管理，网络层拦截 + 二次认证 ----------
    # 单点部署下 admin/ 与前台同站，noindex / robots 都不算拦截，这一层才生效。
    # 二选一或叠加：把 10.0.0.0/8 换成运维实际办公网 / VPN 段。
    location ^~ /admin/ {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        auth_basic "SUMFARM ADMIN";
        auth_basic_user_file /etc/nginx/.sf_admin_htpasswd;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ =404;
    }

    # ---------- P0：默认按扩展名白名单，非公开文件一律 404 ----------
    # 即使将来有人误把 .sql / .py / .json / .md 拷回站点根，也不会被下载。
    # 注意：正则 location 优先于 location /；^~ 的 /_internal/ 与 /admin/ 优先级更高。
    location ~* \.(?:sql|py|pyc|json|md|log|zip|tar|gz|bak|conf|sh|yml|yaml|env|pem|key|crt|swp|svn|gitignore)$ {
        return 404;
    }

    # ---------- 静态资源：长缓存（带 ?v= 版本号）----------
    location ~* \.(?:css|js|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # WebP MIME
    types { image/webp webp; }

    # ---------- 公开页面 ----------
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # ---------- 真实后端 API 反向代理（useMock=false 时启用）----------
    # 前端只带 Authorization: Bearer；身份 / 角色 / 审核级别 / 决策一律由后端从会话注入，
    # 忽略前端传值（见 db/api_catalog.json 的 source=session 字段）。
    location ^~ /api/v1/ {
        limit_req zone=sf_api burst=60 nodelay;
        proxy_pass https://backend.internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
    }
    location = /api/v1/admin/login { limit_req zone=sf_auth burst=5 nodelay; proxy_pass https://backend.internal/; }
    location = /api/v1/upload      { limit_req zone=sf_upload burst=2 nodelay; client_max_body_size 20m; proxy_pass https://backend.internal/; }

    # ---------- 登录 / 注册类页面：禁止缓存 ----------
    location ~ ^/(account|login|register|forgot|admin/login)\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }
}

# HTTP 全量跳 HTTPS
server {
    listen 80;
    server_name iarm.fun;
    return 301 https://$host$request_uri;
}
